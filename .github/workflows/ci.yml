name: CI Pipeline

# -------------------------------------------------------
# Runs on every Pull Request targeting main, and on pushes
# to feature branches. Validates code quality, tests, and
# Docker build without publishing any artifacts.
# -------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run unit tests with pytest
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      # Step 5: Validate Docker build (build only, do NOT push)
      - name: Validate Docker build
        run: |
          docker build -t student-ml-api:ci-test .
